[build]
  command = "npm ci && npx @11ty/eleventy"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"

[[plugins]]
  package = "@netlify/plugin-sitemap"

# ── Trailing slash ─────────────────────────────────────────
# Red de seguridad para links viejos o externos sin / final.
# Sin "force": solo redirige si NO existe ya un archivo real
# en esa ruta, evitando loops contra las páginas generadas
# por Eleventy.

[[redirects]]
  from = "/casos-de-exito"
  to = "/casos-de-exito/"
  status = 301

[[redirects]]
  from = "/servicios"
  to = "/servicios/"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/contacto/"
  status = 301

[[redirects]]
  from = "/servicios/:slug"
  to = "/servicios/:slug/"
  status = 301

# ── Headers ────────────────────────────────────────────────

[[headers]]
  for = "/success-cv"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/; style-src 'self' 'unsafe-inline';"
    X-Netlify-Form-Size-Limit = "200000"
